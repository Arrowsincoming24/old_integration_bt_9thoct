<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="context-path" content="/fd-simulator">
    <title>Login - CashCached</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #0D0D12;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            background: #1a1a24;
            border-radius: 16px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .login-header {
            background: linear-gradient(90deg, #FF5BBE, #FF0099);
            color: white;
            padding: 2rem;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .login-form {
            padding: 2rem;
            color: #F5F5F7;
        }
        .form-label {
            color: #F5F5F7;
            font-weight: 500;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 15px;
            background: #0D0D12;
            color: #F5F5F7;
        }
        .form-control:focus {
            border-color: #FF5BBE;
            box-shadow: 0 0 0 0.2rem rgba(255, 91, 190, 0.25);
            background: #0D0D12;
            color: #F5F5F7;
        }
        .btn-login {
            background: linear-gradient(90deg, #FF5BBE, #FF0099);
            border: none;
            border-radius: 16px;
            padding: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0px 4px 10px rgba(255, 0, 153, 0.25);
            transition: all 0.3s ease;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 15px rgba(255, 0, 153, 0.4);
        }
        .social-login {
            margin-top: 1rem;
        }
        .btn-google {
            background: #db4437;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0px 4px 10px rgba(219, 68, 55, 0.4);
        }
        .btn-phone {
            background: linear-gradient(90deg, #7C3AED, #00F0FF);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 12px;
            width: 100%;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .btn-phone:hover {
            transform: translateY(-2px);
            box-shadow: 0px 4px 10px rgba(124, 58, 237, 0.4);
        }
        .otp-section {
            display: none;
        }
        .text-link {
            color: #FF5BBE;
            text-decoration: none;
        }
        .text-link:hover {
            color: #FF0099;
        }
        .form-select {
            background: #0D0D12;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #F5F5F7;
            border-radius: 8px;
        }
        .form-select:focus {
            background: #0D0D12;
            border-color: #FF5BBE;
            color: #F5F5F7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-container">
                    <div class="login-header">
                        <div class="logo"><i class="fas fa-infinity"></i> CashCached</div>
                        <p class="mb-0">Welcome Back!</p>
                    </div>
                    <div class="login-form">
                        <!-- Regular Login Form -->
                        <form id="loginForm" th:action="@{/api/auth/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-login w-100">
                                <i class="fas fa-sign-in-alt"></i> Login
                            </button>
                        </form>

                        <!-- OTP Login Form -->
                        <div id="otpSection" class="otp-section">
                            <form id="otpForm">
                                <div class="mb-3">
                                    <label for="phoneNumber" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phoneNumber" placeholder="+1234567890" required>
                                </div>
                                <button type="button" id="sendOtpBtn" class="btn btn-success btn-phone w-100 mb-3">
                                    <i class="fas fa-sms"></i> Send OTP
                                </button>
                                <div class="mb-3" id="otpInputDiv" style="display: none;">
                                    <label for="otp" class="form-label">Enter OTP</label>
                                    <input type="text" class="form-control" id="otp" placeholder="123456" maxlength="6" required>
                                </div>
                                <button type="button" id="verifyOtpBtn" class="btn btn-primary btn-login w-100" style="display: none;">
                                    <i class="fas fa-check"></i> Verify OTP
                                </button>
                            </form>
                        </div>

                        <div class="text-center mt-3">
                            <button type="button" id="toggleLogin" class="btn btn-link">
                                Login with Phone Number
                            </button>
                        </div>

                        <div class="social-login">
                            <a href="/fd-simulator/oauth2/authorization/google" class="btn btn-google">
                                <i class="fab fa-google"></i> Login with Google
                            </a>
                        </div>

                        <div class="text-center mt-3">
                            <p style="color: #6B7280;">Don't have an account? <a href="/fd-simulator/register" class="text-link">Register here</a></p>
                        </div>

                        <!-- Language and Currency Selector -->
                        <div class="text-center mt-3">
                            <div class="btn-group" role="group">
                                <select class="form-select form-select-sm" id="languageSelect" onchange="changeLanguage()">
                                    <option value="en">English</option>
                                    <option value="ja">日本語</option>
                                </select>
                                <select class="form-select form-select-sm" id="currencySelect" onchange="changeCurrency()">
                                    <option value="USD">USD ($)</option>
                                    <option value="INR">INR (₹)</option>
                                    <option value="KWD">KWD (د.ك)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/fd-simulator/js/auth.js"></script>
    <script>
        let isOtpMode = false;
        
        document.getElementById('toggleLogin').addEventListener('click', function() {
            isOtpMode = !isOtpMode;
            const loginForm = document.getElementById('loginForm');
            const otpSection = document.getElementById('otpSection');
            const toggleBtn = document.getElementById('toggleLogin');
            
            if (isOtpMode) {
                loginForm.style.display = 'none';
                otpSection.style.display = 'block';
                toggleBtn.textContent = 'Login with Username';
            } else {
                loginForm.style.display = 'block';
                otpSection.style.display = 'none';
                toggleBtn.textContent = 'Login with Phone Number';
            }
        });

        document.getElementById('sendOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            if (!phoneNumber) {
                alert('Please enter phone number');
                return;
            }

            postJson('/api/auth/send-otp', { phoneNumber: phoneNumber }, { skipAuth: true })
            .then(response => response.json())
            .then(data => {
                if (data === 'OTP sent successfully') {
                    document.getElementById('otpInputDiv').style.display = 'block';
                    document.getElementById('verifyOtpBtn').style.display = 'block';
                    document.getElementById('sendOtpBtn').textContent = 'Resend OTP';
                    alert('OTP sent successfully!');
                } else {
                    alert('Error: ' + data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error sending OTP');
            });
        });

        document.getElementById('verifyOtpBtn').addEventListener('click', function() {
            const phoneNumber = document.getElementById('phoneNumber').value;
            const otp = document.getElementById('otp').value;
            
            if (!otp) {
                alert('Please enter OTP');
                return;
            }

            postJson('/api/auth/verify-otp', { phoneNumber: phoneNumber, otp: otp }, { skipAuth: true })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', data.username);
                    
                    const base = window.__FD_CONTEXT__ || '';
                    if (data.role === 'ADMIN') {
                        window.location.href = base + '/admin/dashboard';
                    } else {
                        window.location.href = base + '/customer/dashboard';
                    }
                } else {
                    alert('Error: ' + data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error verifying OTP');
            });
        });

        // Language and Currency handling
        function changeLanguage() {
            const language = document.getElementById('languageSelect').value;
            localStorage.setItem('preferredLanguage', language);
            // In a real application, you would reload the page or update the UI
        }
        
        function changeCurrency() {
            const currency = document.getElementById('currencySelect').value;
            localStorage.setItem('preferredCurrency', currency);
            // In a real application, you would update the UI
        }
        
        // Load saved preferences
        function loadPreferences() {
            const savedLanguage = localStorage.getItem('preferredLanguage') || 'en';
            const savedCurrency = localStorage.getItem('preferredCurrency') || 'USD';
            
            document.getElementById('languageSelect').value = savedLanguage;
            document.getElementById('currencySelect').value = savedCurrency;
        }
        
        // Handle regular login form
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            postJson('/api/auth/login', { username: username, password: password }, { skipAuth: true })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('username', data.username);
                    
                    const base = window.__FD_CONTEXT__ || '';
                    if (data.role === 'ADMIN') {
                        window.location.href = base + '/admin/dashboard';
                    } else {
                        window.location.href = base + '/customer/dashboard';
                    }
                } else {
                    alert('Error: ' + data);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Login failed');
            });
        });
        
        // Initialize preferences on page load
        loadPreferences();
    </script>
</body>
</html>
